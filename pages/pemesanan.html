<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pemesanan | FEBRIA FOOD CART</title><link rel="icon" href="../assets/icons/favicon.svg"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/responsive.css"><link rel="stylesheet" href="../assets/css/animations.css"></head><body>
<header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark">✦</span><span><b>FEBRIA</b><small>FOOD CART</small></span></a><button class="menu-toggle" aria-label="Buka menu">☰</button><nav class="main-nav"><a href="menu.html">Menu</a><a href="paket-hemat.html">Paket Hemat</a><a href="lokasi.html">Lokasi</a><a href="tentang.html">Tentang</a></nav><div class="header-actions"><a class="button button-pink" href="pemesanan.html">Pesan <span>→</span></a></div></header>
<main class="container"><div class="page-head"><p class="eyebrow">ORDER / PICKUP</p><h1>PEMESANAN</h1><p>Periksa pesananmu, sesuaikan jumlah, lalu kirim detail pesanan ke WhatsApp.</p></div><div class="content-panel"><div id="cart-items"></div><div class="total-row"><span>Total</span><span id="cart-total">Rp0</span></div><div class="form-grid"><div class="field"><label for="customer-name">Nama pemesan</label><input id="customer-name" placeholder="Nama kamu"></div><div class="field"><label for="pickup-time">Waktu pengambilan</label><input id="pickup-time" type="time"></div><div class="field full"><label for="order-note">Catatan pesanan</label><textarea id="order-note" rows="3" placeholder="Contoh: tidak pedas, gula sedikit..."></textarea></div></div><p style="margin-top:18px"><button class="button button-pink" id="send-order">Kirim Pesanan via WhatsApp →</button> <button class="filter-btn" id="clear-cart">Kosongkan keranjang</button></p></div><script>function drawCart(){const el=document.getElementById("cart-items"),items=Cart.items();el.innerHTML=items.length?items.map(x=>{const p=PRODUCTS.find(y=>y.id===x.id);return p?`<div class="cart-row"><div><b>${p.name}</b><small>${Cart.format(p.price)} / item</small></div><div class="qty-controls"><button data-minus="${p.id}">−</button><b>${x.qty}</b><button data-plus="${p.id}">+</button></div><b>${Cart.format(p.price*x.qty)}</b></div>`:""}).join(""):`<div class="empty-state">Keranjang masih kosong. <a class="text-link" href="menu.html">Pilih menu ↗</a></div>`;document.getElementById("cart-total").textContent=Cart.format(Cart.total())}document.addEventListener("click",e=>{if(e.target.dataset.plus)Cart.change(e.target.dataset.plus,1);if(e.target.dataset.minus)Cart.change(e.target.dataset.minus,-1)});window.addEventListener("cart-updated",drawCart);drawCart();document.getElementById("clear-cart").onclick=()=>{Cart.clear();drawCart()};document.getElementById("send-order").onclick=()=>{const phone="6281234567890",name=document.getElementById("customer-name").value,note=document.getElementById("order-note").value,time=document.getElementById("pickup-time").value;const lines=Cart.items().map(x=>{let p=PRODUCTS.find(y=>y.id===x.id);return p?`${p.name} x${x.qty} — ${Cart.format(p.price*x.qty)}`:""}).join("\n");if(!lines){alert("Keranjang masih kosong.");return}const msg=`Halo FEBRIA FOOD CART, saya ${name||"(nama belum diisi)"} ingin memesan:\n${lines}\nTotal: ${Cart.format(Cart.total())}\nWaktu pickup: ${time||"-"}\nCatatan: ${note||"-"}`;window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank","noopener")}</script></main>
